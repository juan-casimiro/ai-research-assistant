services:
  research-assistant:
    build: .
    env_file:
      - .env
    environment:
      SEED_ON_EMPTY: "true"
      CHROMA_PATH: /data/chroma_db
    ports:
      - "8000:8000"

    volumes:
      - chroma_data:/data/chroma_db

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # Opt-in only: `docker compose --profile ollama up --build`. Never started
  # by a plain `docker compose up --build`, so the default Anthropic-based
  # quickstart pulls no Ollama image and starts no extra container.
  #
  # Reachable from research-assistant at OLLAMA_BASE_URL=http://ollama:11434
  # (set that in .env, alongside LLM_PROVIDER=ollama).
  #
  # The model is not pulled automatically — it's a multi-GB download that
  # doesn't belong in `up`'s critical path. After the container is running:
  #   docker compose --profile ollama exec ollama ollama pull smollm2:1.7b-instruct-q4_K_M
  ollama:
    image: ollama/ollama:0.34.0
    profiles: ["ollama"]
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


volumes:
  chroma_data:
  ollama_data:

